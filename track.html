<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Your Campaign Submission</title>
<style>
  :root {
    --pink: #ff2e88;
    --pink-dark: #e0217a;
    --bg: #f6f7fb;
    --card-bg: #ffffff;
    --text-dark: #1f2937;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 20px 12px 60px;
  }
  .page-wrap { max-width: 480px; margin: 0 auto; }

  .back-link {
    display: inline-block;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 14px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 26px 20px 28px;
    text-align: center;
  }

  h1 { font-size: 1.3rem; color: var(--text-dark); margin: 0 0 6px; }
  p.sub { color: var(--text-muted); font-size: 0.88rem; margin: 0 0 4px; line-height: 1.4; }

  .icon { font-size: 2.5rem; margin: 6px 0 12px; }

  .spinner {
    width: 30px;
    height: 30px;
    border: 3px solid #f0f0f3;
    border-top-color: var(--pink);
    border-radius: 50%;
    margin: 20px auto;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    margin: 10px 0 16px;
  }
  .status-badge.pending { background: #dbeafe; color: #1e40af; }
  .status-badge.active { background: #dcfce7; color: #166534; }
  .status-badge.rejected { background: #fee2e2; color: #991b1b; }
  .status-badge.archived { background: #fef3c7; color: #92400e; }

  .patient-name { font-size: 1.05rem; font-weight: 700; color: var(--text-dark); margin: 0 0 2px; }
  .submitted-date { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 16px; }

  .message-box {
    text-align: left;
    background: #f9fafb;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.9rem;
    color: var(--text-dark);
    line-height: 1.5;
    margin-top: 8px;
  }
  .message-box.rejected-box { background: #fef2f2; color: #7f1d1d; }
  .message-box.approved-box { background: #f0fdf4; color: #14532d; }

  a.primary-btn {
    display: inline-block;
    width: 100%;
    background: var(--pink);
    color: #fff;
    border: none;
    padding: 13px;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: 12px;
    text-decoration: none;
    margin-top: 18px;
    box-sizing: border-box;
  }
  a.primary-btn:hover { background: var(--pink-dark); }

  .error-icon { color: #dc2626; }
</style>
</head>
<body>

<div class="page-wrap">
  <a class="back-link" href="index.html">&larr; Back to campaigns</a>

  <div class="card">
    <h1>Track Your Campaign Submission</h1>

    <div id="loadingState">
      <p class="sub">Looking up your submission&hellip;</p>
      <div class="spinner"></div>
    </div>

    <div id="errorState" style="display:none;">
      <div class="icon error-icon">⚠️</div>
      <p class="sub" id="errorMessage">We couldn't find a submission with that tracking link.</p>
    </div>

    <div id="resultState" style="display:none;">
      <p class="patient-name" id="patientName"></p>
      <p class="submitted-date" id="submittedDate"></p>
      <span class="status-badge" id="statusBadge"></span>
      <div class="message-box" id="messageBox"></div>
      <a class="primary-btn" id="publicLinkBtn" style="display:none;" href="#">View Public Campaign Page</a>
    </div>
  </div>
</div>

<script>
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function showError(message) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('resultState').style.display = 'none';
    document.getElementById('errorState').style.display = 'block';
    document.getElementById('errorMessage').textContent = message;
  }

  function showResult(data) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('resultState').style.display = 'block';

    document.getElementById('patientName').textContent = data.patient_name || 'Your campaign';

    if (data.created_at) {
      const d = new Date(data.created_at);
      document.getElementById('submittedDate').textContent = 'Submitted ' + (isNaN(d) ? '' : d.toLocaleDateString());
    } else {
      document.getElementById('submittedDate').textContent = '';
    }

    const badge = document.getElementById('statusBadge');
    const messageBox = document.getElementById('messageBox');
    const publicLinkBtn = document.getElementById('publicLinkBtn');
    const status = data.status || 'pending';

    badge.className = 'status-badge ' + status;

    if (status === 'pending') {
      badge.textContent = 'Pending Review';
      messageBox.className = 'message-box';
      messageBox.textContent = 'Your campaign is still under review by our team. Check back here any time for updates — there is nothing else you need to do right now.';
    } else if (status === 'active') {
      badge.textContent = 'Approved';
      messageBox.className = 'message-box approved-box';
      messageBox.textContent = 'Great news — your campaign has been approved and is now live! You can view and share the public campaign page below.';
      if (data.public_url) {
        publicLinkBtn.href = data.public_url;
        publicLinkBtn.style.display = 'inline-block';
      }
    } else if (status === 'rejected') {
      badge.textContent = 'Not Approved';
      messageBox.className = 'message-box rejected-box';
      messageBox.textContent = 'Reason: ' + (data.rejection_reason || 'Your submission was not approved at this time.');
    } else if (status === 'archived') {
      badge.textContent = 'Archived';
      messageBox.className = 'message-box';
      messageBox.textContent = 'This campaign has been archived and is no longer accepting donations.';
    } else {
      badge.textContent = status;
      messageBox.className = 'message-box';
      messageBox.textContent = 'Current status: ' + status;
    }
  }

  async function loadStatus() {
    const params = new URLSearchParams(window.location.search);
    const token = (params.get('token') || '').trim();

    if (!token) {
      showError('No tracking link was provided. Please use the exact link you were given after submitting your campaign.');
      return;
    }

    try {
      const res = await fetch('/api/track-campaign?token=' + encodeURIComponent(token));
      const rawText = await res.text();
      let data = null;
      try {
        data = rawText ? JSON.parse(rawText) : {};
      } catch (err) {
        showError('Something went wrong loading your submission status. Please try again later.');
        return;
      }

      if (!res.ok) {
        showError(data.error || 'We could not find a submission with that tracking link.');
        return;
      }

      showResult(data);
    } catch (err) {
      showError('Could not reach the server. Please check your connection and try again.');
    }
  }

  loadStatus();
</script>

</body>
</html>
