<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login</title>
<style>
  :root {
    --pink: #ff2e88;
    --pink-dark: #e0217a;
    --bg: #f6f7fb;
    --card-bg: #ffffff;
    --text-dark: #1f2937;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card-bg);
    max-width: 360px;
    width: 100%;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 28px 26px;
  }
  h1 { font-size: 1.25rem; color: var(--text-dark); margin: 0 0 4px; }
  p.sub { color: var(--text-muted); font-size: 0.85rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    font-size: 1rem;
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    background: var(--pink);
    color: #fff;
    border: none;
    padding: 13px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
  }
  button:hover { background: var(--pink-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg {
    color: #dc2626;
    font-size: 0.85rem;
    margin-top: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Admin Login</h1>
  <p class="sub">Sign in to manage fundraising campaigns.</p>

  <form id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required />

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required />

    <button type="submit" id="loginBtn">Log In</button>
  </form>

  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
  /*
    =========================================================
    ADMIN LOGIN
    =========================================================
    We POST the username/password to /api/admin/login. That
    function checks them against ADMIN_USERNAME/ADMIN_PASSWORD
    (Vercel environment variables — never stored in Supabase),
    and if they match, sets a secure, HttpOnly session cookie.
    We never see or store that cookie's value in JavaScript;
    the browser handles it automatically from here on.
  */
  const form = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      if (res.ok) {
        // Login succeeded — the browser now holds the session cookie.
        window.location.href = 'dashboard.html';
        return;
      }

      const data = await res.json().catch(() => ({}));
      errorMsg.textContent = data.error || 'Login failed. Please try again.';
    } catch (err) {
      console.error('Login error:', err);
      errorMsg.textContent = 'Something went wrong. Please try again.';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log In';
    }
  });
</script>

</body>
</html>
